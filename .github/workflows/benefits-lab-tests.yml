name: BenefitsOps Lab - Tests
on:
  push:
    paths:
      - 'benefits-lab/**'
      - '.github/workflows/benefits-lab-tests.yml'
  pull_request:
    paths:
      - 'benefits-lab/**'
      - '.github/workflows/benefits-lab-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate syntax
        run: |
          node --check benefits-lab/audit/core.mjs
          node --check benefits-lab/audit/app.mjs
          node --check benefits-lab/service/core.mjs
          node --check benefits-lab/service/app.mjs
          node --check benefits-lab/tools/ai_brief.mjs
      - name: Run independent unit tests
        run: node --test benefits-lab/tests/*.test.mjs
      - name: Validate fallback brief production
        run: |
          node benefits-lab/tools/ai_brief.mjs --audit >/tmp/audit_brief.md
          node benefits-lab/tools/ai_brief.mjs --service >/tmp/service_brief.md
          test -s /tmp/audit_brief.md
          test -s /tmp/service_brief.md
